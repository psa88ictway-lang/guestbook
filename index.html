<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>세오 방명록</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1f1f1d;
      --muted: #6b6b63;
      --border: #e3e3de;
      --accent: #3ecf8e;
      --accent-text: #05301c;
      --warn-bg: #fdeaea;
      --warn-text: #8a2020;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --card: #262624;
        --text: #f0f0ed;
        --muted: #a0a099;
        --border: #3a3a37;
        --warn-bg: #3d2020;
        --warn-text: #f5b5b5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px 64px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      line-height: 1.6;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.75rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: .9rem; }
    form, .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    form { margin-bottom: 28px; }
    label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      resize: vertical;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    textarea { min-height: 90px; }
    button {
      font: inherit; font-weight: 600; cursor: pointer;
      border: none; border-radius: 8px;
      padding: 10px 18px;
      background: var(--accent); color: var(--accent-text);
    }
    button:hover:not(:disabled) { opacity: .9; }
    button:disabled { opacity: .5; cursor: default; }
    .count { font-size: .85rem; color: var(--muted); margin: 0 0 12px; }
    .card { margin-bottom: 12px; }
    .card-head {
      display: flex; justify-content: space-between;
      align-items: baseline; gap: 12px; margin-bottom: 8px;
    }
    .name { font-weight: 700; word-break: break-all; }
    .meta { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .time { font-size: .78rem; color: var(--muted); white-space: nowrap; }
    .msg { margin: 0; white-space: pre-wrap; word-break: break-word; }
    .del {
      background: none; color: var(--muted);
      padding: 2px 6px; font-size: .78rem; font-weight: 400;
    }
    .del:hover:not(:disabled) { color: #d33; opacity: 1; }
    .status { color: var(--muted); text-align: center; padding: 32px 0; }
    .warn {
      background: var(--warn-bg); color: var(--warn-text);
      border-radius: 8px; padding: 10px 12px;
      font-size: .85rem; margin-bottom: 16px;
      white-space: pre-wrap;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🎉 세오 방명록</h1>
    <p class="sub">이름과 남기고 싶은 말을 적어주세요.</p>

    <p id="warn" class="warn" hidden></p>

    <form id="form">
      <label for="name">이름</label>
      <input id="name" maxlength="20" placeholder="홍길동" autocomplete="name" required/>

      <label for="message">남기고 싶은 말</label>
      <textarea id="message" rows="3" maxlength="500" placeholder="자유롭게 남겨주세요" required></textarea>

      <button id="send" type="submit">남기기</button>
    </form>

    <p class="count" id="count"></p>
    <div id="list"><p class="status">불러오는 중…</p></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    // 본인 Supabase 프로젝트 값으로 교체
    var SUPABASE_URL = "https://cxraifolmcchskmxuval.supabase.co";
    var SUPABASE_KEY = "sb_publishable_ZEWAlhGi6lwXwXmfCtfx4g_hO8IHWrY";

    var form = document.getElementById('form');
    var nameEl = document.getElementById('name');
    var msgEl = document.getElementById('message');
    var sendBtn = document.getElementById('send');
    var listEl = document.getElementById('list');
    var countEl = document.getElementById('count');
    var warnEl = document.getElementById('warn');

    function warn(text) { warnEl.textContent = text; warnEl.hidden = false; }
    function clearWarn() { warnEl.hidden = true; }

    function status(text) {
      listEl.textContent = '';
      var p = document.createElement('p');
      p.className = 'status';
      p.textContent = text;
      listEl.appendChild(p);
    }

    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      warn('Supabase 라이브러리를 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.');
      status('목록을 불러올 수 없습니다.');
      sendBtn.disabled = true;
      return;
    }

    var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function formatTime(value) {
      var d = new Date(value);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleString('ko-KR', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function makeCard(row) {
      var card = document.createElement('div');
      card.className = 'card';

      var head = document.createElement('div');
      head.className = 'card-head';

      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = row.name;

      var meta = document.createElement('span');
      meta.className = 'meta';

      var time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(row.created_at);
      meta.appendChild(time);

      if (row.id !== undefined && row.id !== null) {
        var del = document.createElement('button');
        del.className = 'del';
        del.type = 'button';
        del.textContent = '삭제';
        del.addEventListener('click', function () { remove(row.id, del); });
        meta.appendChild(del);
      }

      head.appendChild(name);
      head.appendChild(meta);

      var msg = document.createElement('p');
      msg.className = 'msg';
      msg.textContent = row.message;

      card.appendChild(head);
      card.appendChild(msg);
      return card;
    }

    async function load() {
      var res = await db.from('guestbook')
        .select('*')
        .order('created_at', { ascending: false });

      if (res.error) {
        countEl.textContent = '';
        warn('목록을 불러오지 못했습니다: ' + res.error.message);
        status('목록을 불러올 수 없습니다.');
        return;
      }

      clearWarn();
      var rows = res.data || [];
      countEl.textContent = rows.length ? '총 ' + rows.length + '개의 글' : '';

      if (!rows.length) {
        status('아직 남겨진 글이 없습니다. 첫 글을 남겨보세요!');
        return;
      }

      listEl.textContent = '';
      rows.forEach(function (row) { listEl.appendChild(makeCard(row)); });
    }

    async function remove(id, btn) {
      if (!window.confirm('이 글을 삭제할까요?')) return;
      btn.disabled = true;

      // .select()를 붙여야 실제로 지워진 행을 돌려받는다.
      // RLS에 delete 정책이 없으면 error 없이 0건만 지워지므로 이걸로 판별한다.
      var res = await db.from('guestbook').delete().eq('id', id).select();

      if (res.error) {
        warn('삭제하지 못했습니다: ' + res.error.message);
        btn.disabled = false;
        return;
      }
      if (!res.data || !res.data.length) {
        warn('삭제 권한이 없습니다.\n' +
             'Supabase의 guestbook 테이블에 delete 정책(RLS)을 추가해야 합니다.');
        btn.disabled = false;
        return;
      }

      clearWarn();
      load();
    }

    form.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var name = nameEl.value.trim();
      var message = msgEl.value.trim();
      if (!name || !message) return;

      sendBtn.disabled = true;
      sendBtn.textContent = '저장 중…';

      var res = await db.from('guestbook').insert({ name: name, message: message });

      sendBtn.disabled = false;
      sendBtn.textContent = '남기기';

      if (res.error) {
        warn('저장하지 못했습니다: ' + res.error.message);
        return;
      }

      clearWarn();
      msgEl.value = '';
      load();
      msgEl.focus();
    });

    load();
  })();
  </script>
</body>
</html>
